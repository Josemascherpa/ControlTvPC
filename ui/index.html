<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cine ControlTV</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- La app consulta internet directo: las conexiones se abren mientras carga la página. -->
<link rel="preconnect" href="https://api.framextv.xyz" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="cine.css">
</head>
<body>
<div id="activity" aria-hidden="true"></div>
<header id="topbar">
  <a class="brand" id="brand" href="#" aria-label="Volver al principio del catálogo">
    <span class="brand-dot"></span><span class="brand-name">Cine</span>
  </a>
  <form id="searchForm" role="search">
    <input id="search" type="search" placeholder="Buscar películas o series" aria-label="Buscar películas o series" maxlength="80" autocomplete="off" spellcheck="false">
    <button id="searchGo" class="icon-btn" type="submit" aria-label="Buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    </button>
  </form>
</header>

<main id="catalog">
  <!-- Arriba: el título elegido (como Google TV). Dos imágenes que se turnan para cambiar con un fundido. -->
  <section id="hero" hidden>
    <img id="heroImage" class="hero-image is-shown" alt="" decoding="async">
    <img id="heroImageNext" class="hero-image" alt="" decoding="async">
    <div class="hero-shade"></div>
    <div class="hero-copy" id="heroCopy">
      <p class="eyebrow" id="heroEyebrow">Destacado</p>
      <h1 id="heroTitle"></h1>
      <p class="meta" id="heroMeta"></p>
      <p class="overview" id="heroOverview"></p>
      <div class="actions" id="heroActions">
        <button id="heroPlay" class="btn primary" type="button"><span class="ico">▶</span>Reproducir</button>
        <button id="heroInfo" class="btn" type="button"><span class="ico">ⓘ</span>Más información</button>
      </div>
    </div>
  </section>
  <!-- Abajo: las filas. Al subir o bajar, se desliza la lista entera (suave, sin mover la página). -->
  <div id="rowsViewport" class="rows-viewport">
    <div id="rowsScroll" class="rows-scroll">
      <section id="rows" class="rows" aria-label="Catálogo"></section>
      <p id="status" class="status" role="status">Cargando catálogo…</p>
      <p id="hint" class="hint">Flechas para moverte · OK para elegir · Atrás para volver · Escribí en el celular para buscar</p>
    </div>
  </div>
</main>

<section id="details" hidden aria-label="Ficha del título">
  <div class="detail-bg"><img id="detailImage" alt="" decoding="async"></div>
  <div class="detail-shade"></div>
  <button id="detailClose" class="icon-btn floating" type="button" aria-label="Volver al catálogo">←</button>
  <div class="detail-body" id="detailBody">
    <p class="eyebrow" id="detailKind"></p>
    <h2 id="detailTitle"></h2>
    <p class="meta" id="detailMeta"></p>
    <p class="lang-note" id="detailLanguage"></p>
    <p class="overview" id="detailOverview"></p>
    <p class="cast" id="detailCast"></p>
    <div class="actions">
      <button id="detailPlay" class="btn primary" type="button"><span class="ico">▶</span>Reproducir</button>
      <button id="detailServers" class="btn" type="button">Servidores</button>
    </div>
    <p id="detailStatus" class="status" role="status"></p>
    <div id="servers" class="chips" hidden></div>
    <div id="seasonBar" class="seasons" hidden></div>
    <div id="episodes" class="episodes"></div>
    <div id="related" class="related" hidden>
      <h3>También te puede gustar</h3>
      <div class="related-track" id="relatedTrack"></div>
    </div>
  </div>
</section>

<section id="player" hidden aria-label="Reproductor">
  <video id="video" playsinline preload="none" tabindex="-1"></video>
  <div id="subtitleBox" class="subtitle-box" aria-hidden="true"></div>
  <div id="playerTop" class="player-top" hidden>
    <button id="playerBack" class="icon-btn" type="button" aria-label="Volver">←</button>
    <div class="player-title"><h2 id="playingTitle"></h2><p id="playingMeta"></p></div>
  </div>
  <div id="playerControls" class="player-controls" hidden>
    <div class="progress"><div id="progressFill"></div></div>
    <div class="controls-row">
      <button id="rewind" class="round" type="button" aria-label="Retroceder 10 segundos">−10</button>
      <button id="toggle" class="round play" type="button" aria-label="Reproducir o pausar">▶</button>
      <button id="forward" class="round" type="button" aria-label="Avanzar 10 segundos">+10</button>
      <span id="time" class="time">0:00</span>
      <span class="spacer"></span>
      <button id="subtitlesBtn" class="pill" type="button">Subtítulos</button>
      <button id="subtitleSizeBtn" class="pill" type="button">Tamaño</button>
      <button id="subtitleHeightBtn" class="pill" type="button">Altura</button>
      <button id="audioBtn" class="pill" type="button">Audio</button>
      <button id="nextBtn" class="pill accent" type="button" hidden>Siguiente episodio</button>
    </div>
  </div>
  <div id="playerCenter" class="player-center">
    <span id="playerSpinner" class="spinner" hidden aria-hidden="true"></span>
    <p id="playerStatus" class="status" role="status"></p>
    <button id="retryBtn" class="btn primary" type="button" hidden>Probar otro servidor</button>
  </div>
</section>

<script type="module" src="js/web/cine/main.js"></script>
</body>
</html>
